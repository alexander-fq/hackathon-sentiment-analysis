spring.application.name=sentiment-api
# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# H2 DATABASE (DEV) - PERSISTENT
# ===============================
# Usando archivo en lugar de memoria para persistencia durante desarrollo
spring.datasource.url=jdbc:h2:file:./data/sentimentdb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.hackathon.sentiment=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# ML SERVICE (FastAPI)
# ===============================
ml.service.base-url=http://localhost:8000
ml.service.predict-endpoint=/predict
ml.service.timeout-seconds=10
